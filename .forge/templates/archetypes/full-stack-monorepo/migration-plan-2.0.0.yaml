# Forge Archetype — full-stack-monorepo MIGRATION plan (1.0.0 → 2.0.0)
# <!-- Audit: B.8.10b (b8-10b-migrate-render, FR-B810B-001) -->
#
# NOT a `forge init` input. Deliberately named `migration-plan-` rather than
# `scaffold-plan-`: a third `scaffold-plan-*.yaml` here would invite exactly the
# confusion that a plan's mere existence proves something invokes it. `forge init`
# uses scaffold-plan.yaml (1.0.0) or scaffold-plan-2.0.0.yaml (2.0.0); this file is
# consumed ONLY by bin/forge-migrate-flagship.sh.
#
# WHY IT EXISTS. The migration used to point its 3-way-merge RIGHT side straight at
# the 2.0.0 template tree and `cp` the files across, so adopters received 36 raw
# `.tmpl` files — 24 still carrying `<project-name>` — and 9 of those landed beside
# an already-rendered file of the same name. The fix renders through overlay.sh,
# which needs a plan; this is that plan (ADR-B810B-003).
#
# WHY ALL 36 AND NOT THE 13 IN scaffold-plan-2.0.0.yaml. The migration's contract
# (docs/MIGRATIONS.md) is that the adopter receives the Qwik web-public surface,
# Zitadel and pgvector — precisely the files B.8.14 left out of fresh-init as an
# explicit scope decision. Reusing the scaffold plan would render 13 files and
# silently drop the 23 this migration exists to deliver.
#
# COVERAGE IS ASSERTED, NOT TRUSTED: b8-10.test.sh::T-014 fails if this list and the
# 2.0.0/ tree disagree in either direction. It compares against `git ls-files`, not a
# filesystem walk — the tree is a working directory and runtime tooling can drop
# ignored state into it (that happened while this plan was being authored and briefly
# made the count 37).
#
# Targets are the adopter-project layout: the `2.0.0/` prefix and the `.tmpl` suffix
# are both dropped here, which is why the script needs no path-mapping of its own.
archetype: full-stack-monorepo
version: 2.0.0
templates:
- source: 2.0.0/.env.example.tmpl
  target: .env.example
  substitute: true
