# Forge scaffold plan — mobile-pwa-first / 2.0.0
# <!-- Audit: B.9.2 (b9-2-web-pwa) — ADR-B9-2-002: ONE plan, BOTH surfaces -->
#
# Rendered by .forge/scripts/scaffolder/overlay.sh via
# bin/forge-init-mobile-pwa-first.sh. The wrapper absolutizes the `source:` paths
# below before calling overlay.sh, because overlay.sh:128 hardcodes its ARCHETYPE_DIR
# to full-stack-monorepo (the documented forge-init-ai-native-rag.sh:144-159 trick).
# Paths here stay RELATIVE so the committed plan remains portable.
#
# NO VERSION PIN may appear in this file — pins live in the standards
# (web-frontend.yaml, pwa.yaml) and are resolved verify-then-pin at implement.
#
# The android/app/src/main/kotlin/{{reverse_domain_path}} directory is rendered
# under its literal placeholder name; the WRAPPER relocates it to the real package
# path afterwards (ADR-B9-2-006 — overlay.sh cannot relocate a directory, and
# byte-equivalence with the mobile-only render forbids restructuring the template).
